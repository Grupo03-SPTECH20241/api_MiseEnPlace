name: CI/CD Pipeline

on:
  push:
    branches:
      - hml
  pull_request:
    branches:
      - hml

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Test with Maven
        run: mvn clean install -DskipTests

      - name: List target directory
        run: |
          ls -la target
          find target -name "*.jar"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-backend
          path: target/*.jar

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-backend
          path: target/

      - name: List downloaded artifacts
        run: ls -la target

      - name: Prepare Temporary Directory
        run: mkdir -p temporaria/target

      - name: Transfer JAR to Public EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.PUBLIC_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PUBLIC_EC2_KEY }}
          source: "target/api-mise-en-place-0.0.1-SNAPSHOT.jar"
          target: "temporaria/"

      - name: List files in temporaria on Public EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PUBLIC_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PUBLIC_EC2_KEY }}
          script: |
            ls -la temporaria/

      - name: Create PEM key for Private EC2
        run: |
          echo "${{ secrets.PRIVATE_EC2_PEM }}" >> temporaria/target/private_ec2_key.pem
          chmod 400 temporaria/target/private_ec2_key.pem

      - name: List files in temporaria/target
        run: ls -la temporaria/target/

      - name: Check permissions of private key
        run: ls -la temporaria/target/private_ec2_key.pem

      - name: Transfer JAR to Private EC2 via Bastion Host
        run: |
          scp -i  temporaria/target/private_ec2_key.pem \
           -o StrictHostKeyChecking=no \
           -o UserKnownHostsFile=/dev/null \
           -o ProxyJump=ubuntu@${{ secrets.PUBLIC_EC2_HOST }} \
           temporaria/target/api-mise-en-place-0.0.1-SNAPSHOT.jar \
           ubuntu@${{ secrets.PRIVATE_EC2_HOST }}:/home/ubuntu/temporaria/

      - name: Restart Application on Private EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PRIVATE_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_EC2_KEY }}
          script: |
            sudo systemctl restart springboot-app.service
