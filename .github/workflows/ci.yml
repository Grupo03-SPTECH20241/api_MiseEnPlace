name: CI/CD Pipeline

on:
  push:
    branches:
      - hml
  pull_request:
    branches:
      - hml

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Test with Maven
        run: mvn clean install -DskipTests

      - name: List target directory
        run: |
          ls -la target
          find target -name "*.jar"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-backend
          path: target/*.jar

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-backend
          path: target/

      - name: List downloaded artifacts
        run: ls -la target

      - name: Verify JAR file exists
        run: |
          if [ ! -f target/*.jar ]; then
            echo "JAR file not found!"
            exit 1
          fi

      - name: Prepare Temporary Directory and Create PEM key for Private EC2
        run: |
          mkdir -p temporaria/  # Ensure the directory exists
          echo "${{ secrets.PRIVATE_EC2_PEM }}" > /home/runner/work/api_MiseEnPlace/api_MiseEnPlace/private-key.pem
          chmod 400 /home/runner/work/api_MiseEnPlace/api_MiseEnPlace/private-key.pem

      - name: List files in /home/runner/work/api_MiseEnPlace/api_MiseEnPlace/ before transfer
        run: ls -la /home/runner/work/api_MiseEnPlace/api_MiseEnPlace/

      - name: Transfer JAR to Public EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.PUBLIC_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PUBLIC_EC2_KEY }}
          source: "target/*.jar"
          target: "temporaria/"

      - name: List files in temporaria on Public EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PUBLIC_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PUBLIC_EC2_KEY }}
          script: |
            ls -la temporaria/

      - name: Transfer JAR to Private EC2 via Bastion Host
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.PRIVATE_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_EC2_PEM }}
          source: "target/api-mise-en-place-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/"
          port: 22
          proxy_host: ${{ secrets.PUBLIC_EC2_HOST }}
          proxy_port: 22
          proxy_username: ubuntu
          proxy_key: ${{ secrets.PUBLIC_EC2_KEY }}

      - name: Create update-credentials.sh script
        run: |
          cat << 'EOF' > update-credentials.sh
          #!/bin/bash
          CREDENTIALS_FILE="/home/ubuntu/.aws/credentials"
          AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}"
          sed -i "s/aws_access_key_id = .*/aws_access_key_id = $AWS_ACCESS_KEY_ID/" $CREDENTIALS_FILE
          sed -i "s/aws_secret_access_key = .*/aws_secret_access_key = $AWS_SECRET_ACCESS_KEY/" $CREDENTIALS_FILE
          sed -i "s/aws_session_token = .*/aws_session_token = $AWS_SESSION_TOKEN/" $CREDENTIALS_FILE
          echo "Credenciais atualizadas com sucesso."
          EOF
        shell: bash

      - name: Transfer update-credentials.sh to Private EC2 via Bastion Host
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.PRIVATE_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_EC2_PEM }}
          source: "update-credentials.sh"
          target: "/home/ubuntu/"
          port: 22
          proxy_host: ${{ secrets.PUBLIC_EC2_HOST }}
          proxy_port: 22
          proxy_username: ubuntu
          proxy_key: ${{ secrets.PUBLIC_EC2_KEY }}

      - name: Execute update-credentials.sh on Private EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PRIVATE_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_EC2_PEM }}
          port: 22
          proxy_host: ${{ secrets.PUBLIC_EC2_HOST }}
          proxy_port: 22
          proxy_username: ubuntu
          proxy_key: ${{ secrets.PUBLIC_EC2_KEY }}
          script: |
            chmod +x /home/ubuntu/update-credentials.sh
            /home/ubuntu/update-credentials.sh

      - name: Check if Java is running on port 8080
        id: check_java
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PRIVATE_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_EC2_PEM }}
          port: 22
          proxy_host: ${{ secrets.PUBLIC_EC2_HOST }}
          proxy_port: 22
          proxy_username: ubuntu
          proxy_key: ${{ secrets.PUBLIC_EC2_KEY }}
          script: |
            if lsof -Pi :8080 -sTCP:LISTEN -t >/dev/null ; then
              echo "Java is running on port 8080"
              echo "status=running" >> $GITHUB_ENV
            else
              echo "Java is not running on port 8080"
              echo "status=stopped" >> $GITHUB_ENV
            fi
      - name: Restart Java Service
        if: env.status == 'running'
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PRIVATE_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_EC2_PEM }}
          port: 22
          proxy_host: ${{ secrets.PUBLIC_EC2_HOST }}
          proxy_port: 22
          proxy_username: ubuntu
          proxy_key: ${{ secrets.PUBLIC_EC2_KEY }}
          script: |
            echo "Restarting Java service..."
            pkill -f 'java -jar'
            nohup java -jar /home/ubuntu/api-mise-en-place-0.0.1-SNAPSHOT.jar &

      - name: Start Java Service
        if: env.status == 'stopped'
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PRIVATE_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_EC2_PEM }}
          port: 22
          proxy_host: ${{ secrets.PUBLIC_EC2_HOST }}
          proxy_port: 22
          proxy_username: ubuntu
          proxy_key: ${{ secrets.PUBLIC_EC2_KEY }}
          script: |
            echo "Starting Java service..."
            nohup java -jar /home/ubuntu/api-mise-en-place-0.0.1-SNAPSHOT.jar &

