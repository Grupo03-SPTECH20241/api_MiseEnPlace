name: CI/CD Pipeline

on:
  push:
    branches:
      - hml
  pull_request:
    branches:
      - hml

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Test with Maven
        run: mvn clean install -DskipTests

      - name: List target directory
        run: |
          ls -la target
          find target -name "*.jar"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-backend
          path: target/*.jar

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create PEM key for Private EC2
        run: |
          echo "${{ secrets.PRIVATE_EC2_PEM }}" > private_ec2_key.pem
          chmod 400 private_ec2_key.pem

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-backend
          path: target/

      - name: List downloaded artifacts
        run: ls -la target

      - name: Prepare Temporary Directory
        run: mkdir -p temporaria/target

      - name: Copy private key to temporaria/target
        run: cp private_ec2_key.pem temporaria/target/

      # Add Bastion Host and Private EC2 to known_hosts
      - name: Add Bastion and Private EC2 Hosts to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "Adding Bastion Host and Private EC2 Host to known_hosts..."
          
          # Add Bastion Host to known_hosts
          ssh-keyscan -H ${{ secrets.PUBLIC_EC2_HOST }} >> ~/.ssh/known_hosts || {
            echo "Failed to add Bastion host to known_hosts. Exiting...";
            exit 1;
          }

          # Add Private EC2 Host to known_hosts
          ssh-keyscan -H ${{ secrets.PRIVATE_EC2_HOST }} >> ~/.ssh/known_hosts || {
            echo "Failed to add Private EC2 host to known_hosts. Exiting...";
            exit 1;
          }

          chmod 644 ~/.ssh/known_hosts

      # Test SSH Connectivity through Bastion Host with -J (ProxyJump)
      - name: Test SSH Connectivity through Bastion
        run: |
          echo "Testing SSH connection to Private EC2 through Bastion Host..."
          ssh -o StrictHostKeyChecking=no -i private_ec2_key.pem -J ubuntu@${{ secrets.PUBLIC_EC2_HOST }} ubuntu@${{ secrets.PRIVATE_EC2_HOST }} exit || {
            echo "SSH connection failed!";
            exit 1;
          }

      - name: Transfer JAR to Public EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.PUBLIC_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PUBLIC_EC2_KEY }}
          source: "target/api-mise-en-place-0.0.1-SNAPSHOT.jar"
          target: "temporaria/"

      - name: List files in temporaria on Public EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PUBLIC_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PUBLIC_EC2_KEY }}
          script: |
            ls -la temporaria/

      # Transfer JAR to Private EC2 through Bastion using -J (ProxyJump)
      - name: Transfer JAR to Private EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PUBLIC_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PUBLIC_EC2_KEY }}
          script: |
            scp -i temporaria/target/private_ec2_key.pem -o ProxyJump=ubuntu@${{ secrets.PUBLIC_EC2_HOST }} \
                temporaria/target/api-mise-en-place-0.0.1-SNAPSHOT.jar \
                ubuntu@${{ secrets.PRIVATE_EC2_HOST }}:/home/ubuntu/app/

      - name: Restart Application on Private EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PRIVATE_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_EC2_KEY }}
          script: |
            sudo systemctl restart springboot-app.service
