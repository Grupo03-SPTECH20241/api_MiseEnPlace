name: CI/CD Pipeline

on:
  push:
    branches:
      - hml
  pull_request:
    branches:
      - hml

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Configuração do repositório
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Instalar Java JDK e configurar Maven
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 3. Construir e testar
      - name: Build and Test with Maven
        run: mvn clean install -DskipTests

      # 4. Debug target directory
      - name: List target directory
        run: |
          ls -la target
          find target -name "*.jar"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      # 1. Configuração do repositório
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Criar arquivo de chave PEM para a EC2 privada
      - name: Create PEM key for Private EC2
        run: |
          echo "${{ secrets.PRIVATE_EC2_PEM }}" > private_ec2_key.pem
          chmod 600 private_ec2_key.pem

      # 3. Transferir artefato para a EC2 pública
      - name: Transfer JAR to Public EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.PUBLIC_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PUBLIC_EC2_KEY }}
          source: "target/*.jar"
          target: "/tmp/"

      # 4. Transferir artefato para a EC2 privada via EC2 pública
      - name: Transfer JAR to Private EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PUBLIC_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PUBLIC_EC2_KEY }}
          script: |
            scp -i private_ec2_key.pem /tmp/*.jar ubuntu@${{ secrets.PRIVATE_EC2_HOST }}:/home/ubuntu/app/

      # 5. Reiniciar a aplicação na EC2 privada
      - name: Restart Application on Private EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PUBLIC_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PUBLIC_EC2_KEY }}
          script: |
            ssh -i private_ec2_key.pem ubuntu@${{ secrets.PRIVATE_EC2_HOST }} << EOF
            sudo systemctl restart springboot-app.service
            EOF